site_name: HEP–ML Living Guide
site_description: A curated, community-driven field guide to machine learning for particle physics.
site_url: https://iml-wg.github.io/HEPML-LivingGuide/
repo_url: https://github.com/iml-wg/HEPML-LivingGuide/
repo_name: iml-wg/HEPML-LivingGuide
edit_uri: edit/main/docs/

# ----------------------------------------------------------------------
# Navigation
#
# The taxonomy follows the two independent axes described in the
# transition paper (Sec. 3.1): HEP application and ML method, with
# cross-links between them. Sections that don't yet have a contributor
# can simply be omitted from the nav until they exist.
# ----------------------------------------------------------------------
nav:
  - Home: index.md
  - How to use this guide: how-to-use.md
  - By HEP application:
      - Overview: applications/index.md
      - Triggering: applications/triggering.md
      - Reconstruction: applications/reconstruction.md
      - Simulation & fast emulation: applications/simulation.md
      - Unfolding & simulation-based inference: applications/unfolding-inference.md
      - Anomaly detection: applications/anomaly-detection.md
      - Phenomenology: applications/phenomenology.md
      - Formal theory: applications/formal-theory.md
      - Lattice QCD: applications/lattice.md
  - By ML method:
      - Overview: methods/index.md
      - Equivariant & geometric architectures: methods/equivariant-geometric.md
      - Generative models: methods/generative.md
      - Density estimation & likelihood ratios: methods/density-ratio.md
      - Uncertainty quantification & calibration: methods/uncertainty.md
      - Explainable AI & interpretability: methods/explainable-ai.md
      - Differentiable programming: methods/differentiable.md
      - Foundation models: methods/foundation-models.md
      - LLMs & agents: methods/agents.md
  - Resources:
      - Reviews & lecture notes: resources/reviews-lectures.md
      - Benchmarks & datasets: resources/benchmarks.md
      - Community challenges: resources/challenges.md
      - Related living resources: resources/related.md
  - Contribute: contribute.md
  - About:
      - About the Guide: about.md
      - The archived Living Review: archived-review.md
      - Code of conduct: code-of-conduct.md
      - Cite us: cite.md

# ----------------------------------------------------------------------
# Hooks
#
# section_status.py renders the status banner, the staleness notice and the
# per-section citation block from sections/*.yml. These are never hand-written
# into the Markdown: a "last updated" line a contributor has to remember to edit
# is a line that goes stale silently.
# ----------------------------------------------------------------------
hooks:
  - hooks/section_status.py

# ----------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo-light.png
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.share
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: Geist Mono

# ----------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  # custom_icons adds overrides/.icons to the icon index, which is what makes
  # :academicons-orcid: and :academicons-inspire: resolve. Putting the SVGs in
  # custom_dir is not enough on its own; the path has to be declared here.
  # The two icons are vendored from Academicons (SIL OFL 1.1) so that author
  # identifiers do not depend on a CDN and inherit the theme's link color.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iml-wg/HEPML-LivingGuide
  generator: false

copyright: >
  The HEP–ML Living Guide is maintained by the HEP–ML community.
  Content is licensed CC BY 4.0.
